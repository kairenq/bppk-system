<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" style="background: white">
  <defs>
    <style>
      .title { font: bold 24px Arial; fill: #000; text-anchor: middle; }
      .actor-text { font: bold 16px Arial; fill: #000; text-anchor: middle; }
      .usecase { fill: white; stroke: #000; stroke-width: 2; }
      .usecase-text { font: 14px Arial; fill: #000; text-anchor: middle; }
      .actor-line { stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; }
      .system-box { fill: none; stroke: #000; stroke-width: 2; }
      .system-title { font: bold 18px Arial; fill: #000; text-anchor: middle; }
      .connection { stroke: #000; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="800" y="40" class="title">Use Case диаграмма: Система тестирования БППК</text>

  <!-- System boundary box -->
  <rect x="350" y="80" width="900" height="1000" class="system-box" rx="10"/>
  <text x="800" y="110" class="system-title">Система тестирования</text>

  <!-- ACTOR 1: АДМИНИСТРАТОР (left top) -->
  <g transform="translate(150, 200)">
    <!-- Stick figure -->
    <circle cx="50" cy="25" r="20" fill="white" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="45" x2="50" y2="100" class="actor-line"/>
    <line x1="50" y1="60" x2="25" y2="85" class="actor-line"/>
    <line x1="50" y1="60" x2="75" y2="85" class="actor-line"/>
    <line x1="50" y1="100" x2="25" y2="135" class="actor-line"/>
    <line x1="50" y1="100" x2="75" y2="135" class="actor-line"/>
    <text x="50" y="165" class="actor-text">Администратор</text>
  </g>

  <!-- ACTOR 2: ПРЕПОДАВАТЕЛЬ (left middle) -->
  <g transform="translate(150, 550)">
    <!-- Stick figure -->
    <circle cx="50" cy="25" r="20" fill="white" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="45" x2="50" y2="100" class="actor-line"/>
    <line x1="50" y1="60" x2="25" y2="85" class="actor-line"/>
    <line x1="50" y1="60" x2="75" y2="85" class="actor-line"/>
    <line x1="50" y1="100" x2="25" y2="135" class="actor-line"/>
    <line x1="50" y1="100" x2="75" y2="135" class="actor-line"/>
    <text x="50" y="165" class="actor-text">Преподаватель</text>
  </g>

  <!-- ACTOR 3: СТУДЕНТ (right middle) -->
  <g transform="translate(1350, 550)">
    <!-- Stick figure -->
    <circle cx="50" cy="25" r="20" fill="white" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="45" x2="50" y2="100" class="actor-line"/>
    <line x1="50" y1="60" x2="25" y2="85" class="actor-line"/>
    <line x1="50" y1="60" x2="75" y2="85" class="actor-line"/>
    <line x1="50" y1="100" x2="25" y2="135" class="actor-line"/>
    <line x1="50" y1="100" x2="75" y2="135" class="actor-line"/>
    <text x="50" y="165" class="actor-text">Студент</text>
  </g>

  <!-- USE CASES -->

  <!-- Admin Use Cases -->
  <ellipse cx="550" cy="200" rx="140" ry="45" class="usecase"/>
  <text x="550" y="207" class="usecase-text">Управление</text>
  <text x="550" y="225" class="usecase-text">пользователями</text>

  <ellipse cx="550" cy="300" rx="140" ry="45" class="usecase"/>
  <text x="550" y="307" class="usecase-text">Управление</text>
  <text x="550" y="325" class="usecase-text">курсами</text>

  <ellipse cx="550" cy="400" rx="140" ry="45" class="usecase"/>
  <text x="550" y="410" class="usecase-text">Просмотр статистики</text>

  <ellipse cx="800" cy="250" rx="140" ry="45" class="usecase"/>
  <text x="800" y="260" class="usecase-text">Просмотр всех тестов</text>

  <!-- Teacher Use Cases -->
  <ellipse cx="550" cy="600" rx="140" ry="45" class="usecase"/>
  <text x="550" y="610" class="usecase-text">Создание тестов</text>

  <ellipse cx="550" cy="700" rx="140" ry="45" class="usecase"/>
  <text x="550" y="710" class="usecase-text">Редактирование тестов</text>

  <ellipse cx="800" cy="600" rx="140" ry="45" class="usecase"/>
  <text x="800" y="610" class="usecase-text">Добавление вопросов</text>

  <ellipse cx="800" cy="700" rx="140" ry="45" class="usecase"/>
  <text x="800" y="710" class="usecase-text">Просмотр результатов</text>

  <!-- Student Use Cases -->
  <ellipse cx="1050" cy="550" rx="140" ry="45" class="usecase"/>
  <text x="1050" y="560" class="usecase-text">Просмотр тестов</text>

  <ellipse cx="1050" cy="650" rx="140" ry="45" class="usecase"/>
  <text x="1050" y="660" class="usecase-text">Прохождение тестов</text>

  <ellipse cx="1050" cy="750" rx="140" ry="45" class="usecase"/>
  <text x="1050" y="755" class="usecase-text">Просмотр своих</text>
  <text x="1050" y="773" class="usecase-text">результатов</text>

  <!-- Shared Use Cases -->
  <ellipse cx="800" cy="950" rx="140" ry="45" class="usecase"/>
  <text x="800" y="960" class="usecase-text">Авторизация</text>

  <ellipse cx="550" cy="950" rx="140" ry="45" class="usecase"/>
  <text x="550" y="960" class="usecase-text">Управление профилем</text>

  <!-- CONNECTIONS -->

  <!-- Admin connections -->
  <line x1="225" y1="275" x2="410" y2="200" class="connection"/>
  <line x1="225" y1="285" x2="410" y2="300" class="connection"/>
  <line x1="225" y1="295" x2="410" y2="400" class="connection"/>
  <line x1="225" y1="280" x2="660" y2="250" class="connection"/>
  <line x1="200" y1="340" x2="410" y2="950" class="connection"/>
  <line x1="210" y1="345" x2="660" y2="950" class="connection"/>

  <!-- Teacher connections -->
  <line x1="225" y1="625" x2="410" y2="600" class="connection"/>
  <line x1="225" y1="635" x2="410" y2="700" class="connection"/>
  <line x1="225" y1="625" x2="660" y2="600" class="connection"/>
  <line x1="225" y1="635" x2="660" y2="700" class="connection"/>
  <line x1="200" y1="690" x2="410" y2="950" class="connection"/>
  <line x1="210" y1="695" x2="660" y2="950" class="connection"/>

  <!-- Student connections -->
  <line x1="1350" y1="625" x2="1190" y2="550" class="connection"/>
  <line x1="1350" y1="635" x2="1190" y2="650" class="connection"/>
  <line x1="1350" y1="645" x2="1190" y2="750" class="connection"/>
  <line x1="1380" y1="690" x2="940" y2="950" class="connection"/>
</svg>